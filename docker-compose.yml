services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: search_cop
      POSTGRES_PASSWORD: search_cop
      POSTGRES_DB: search_cop
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U search_cop']
      interval: 2s
      timeout: 2s
      retries: 15
